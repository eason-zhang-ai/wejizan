services:
  wejizan:
    build: .
    image: wejizan:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:?请在 .env 中设置 ACCESS_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_DAILY_QUOTA: ${AI_DAILY_QUOTA:-50}
